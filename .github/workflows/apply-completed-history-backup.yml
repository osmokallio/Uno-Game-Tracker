name: Apply completed-game backup fix

on:
  push:
    paths:
      - '.github/workflows/apply-completed-history-backup.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply patch
        run: python scripts/apply_completed_history_backup.py

      - name: Install dependencies
        run: npm ci

      - name: Validate and test
        run: npm run check

      - name: Commit tested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/app.test.cjs
          git commit -m "Allow completed game history backup anytime"
          git push
